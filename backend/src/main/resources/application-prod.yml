spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      # 生产禁止用 update 自动改表，避免静默破坏结构
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false
  devtools:
    add-properties: false
    restart:
      enabled: false      

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  admin:
    bootstrap-password: ${ADMIN_BOOTSTRAP_PASSWORD:}
  cors:
    # 多个用逗号分隔，上线换成真实前端地址
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}