spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      # 生产禁止用 update 自动改表，避免静默破坏结构
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false
  devtools:
    add-properties: false
    restart:
      enabled: false      

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never   # 对外不暴露库密码等细节

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  admin:
    bootstrap-password: ${ADMIN_BOOTSTRAP_PASSWORD:}
  cors:
    # 多个用逗号分隔，上线换成真实前端地址
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  seo:
    public-base-url: ${PUBLIC_BASE_URL:http://localhost:5173}
  soft-delete:
    retain-days: 30
    purge-enabled: true
    purge-cron: "0 0 3 * * *"
  ratelimit:
    login-per-minute: 5
    register-per-minute: 3
    upload-per-minute: 10
  ai:
    # 生产默认走国内可达的 DeepSeek（OpenAI 兼容）；密钥必须用环境变量注入
    # 说明：多数国内云主机访问 openrouter.ai 会 SSL 失败，不宜作为生产默认
    provider: ${AI_PROVIDER:openai-compatible}
    base-url: ${AI_BASE_URL:https://api.deepseek.com/v1}
    api-key: ${AI_API_KEY:}
    model: ${AI_MODEL:deepseek-flash}
    guest-daily-quota: ${AI_GUEST_DAILY_QUOTA:5}
    user-daily-quota: ${AI_USER_DAILY_QUOTA:30}
    timeout-ms: ${AI_TIMEOUT_MS:60000}
    # 生产建议打开，避免额度被刷爆
    quota-enabled: ${AI_QUOTA_ENABLED:true}
    # 默认与文字同一模型（DeepSeek-Flash 原生多模态）；也可单独设 AI_VISION_MODEL
    vision-model: ${AI_VISION_MODEL:deepseek-flash}
    # 留空则复用 base-url / api-key（同一家 DeepSeek）
    vision-base-url: ${AI_VISION_BASE_URL:}
    vision-api-key: ${AI_VISION_API_KEY:}
