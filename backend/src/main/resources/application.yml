app:
  jwt:
    secret: ${JWT_SECRET:personal-hub-dev-secret-key-change-me-32b}
    expiration-ms: 86400000   # 24 小时
  cors:
    allowed-origins: http://localhost:5173
  media:
    # 本地开发：项目下的目录；生产再改成 /var/www/personal-hub-media
    root-dir: ${MEDIA_ROOT:./data/media}
    public-prefix: /media
spring:
  application:
    name: personal-hub
  profiles:
    active: local
  datasource:
    url: jdbc:mysql://localhost:3306/personal_hub?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
    username: root
    password: ${DB_PASSWORD:changeme}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB