app:
  jwt:
    secret: ${JWT_SECRET:personal-hub-dev-secret-key-change-me-32b}
    expiration-ms: 86400000   # 24 小时
  cors:
    allowed-origins: http://localhost:5173
  media:
    # 本地开发：项目下的目录；生产再改成 /var/www/personal-hub-media
    root-dir: ${MEDIA_ROOT:./data/media}
    public-prefix: /media
    chat-temp-ttl-hours: 24
  seo:
    # sitemap / robots 里的站点根；生产设 PUBLIC_BASE_URL=https://你的域名
    public-base-url: ${PUBLIC_BASE_URL:http://localhost:5173}
  ratelimit:
    login-per-minute: 10
    register-per-minute: 5
    upload-per-minute: 20
  soft-delete:
    retain-days: 30
    purge-enabled: true
    purge-cron: "0 0 3 * * *"
  ai:
    # mock：本地演示文案；openai-compatible：接 OpenAI / DeepSeek 等兼容接口
    provider: ${AI_PROVIDER:mock}
    base-url: ${AI_BASE_URL:https://api.openai.com/v1}
    api-key: ${AI_API_KEY:}
    model: ${AI_MODEL:gpt-4o-mini}
    guest-daily-quota: ${AI_GUEST_DAILY_QUOTA:3}
    user-daily-quota: ${AI_USER_DAILY_QUOTA:30}
    timeout-ms: 45000
    # 默认开启配额：访客每日 3 次，登录用户 30 次
    quota-enabled: ${AI_QUOTA_ENABLED:true}
    # 识图：空则回退到 model；另配 vision-* 可换一家识图服务
    vision-model: ${AI_VISION_MODEL:}
    vision-base-url: ${AI_VISION_BASE_URL:}
    vision-api-key: ${AI_VISION_API_KEY:}
spring:
  application:
    name: personal-hub
  profiles:
    active: local
  datasource:
    url: jdbc:mysql://localhost:3306/personal_hub?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
    username: root
    password: ${DB_PASSWORD:changeme}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 25MB
logging:
  pattern:
    console: "%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} [rid=%X{requestId}] - %msg%n"