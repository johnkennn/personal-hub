name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:  # 允许在 Actions 页手动点「Run workflow」

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        env:
          VITE_API_BASE_URL: ""
        run: |
          npm ci
          npm run build

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build backend
        working-directory: backend
        run: ./mvnw -B -DskipTests package

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p 22 ${{ secrets.DEPLOY_HOST }} >> ~/.ssh/known_hosts

      - name: Upload frontend
        run: |
          scp -i ~/.ssh/deploy_key -P 22 -r frontend/dist/. \
            ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:/var/www/personal-hub/

      - name: Upload backend and restart
        run: |
          scp -i ~/.ssh/deploy_key -P 22 \
            backend/target/personal-hub-0.0.1-SNAPSHOT.jar \
            ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:/opt/personal-hub/
          ssh -i ~/.ssh/deploy_key -p 22 \
            ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} \
            'systemctl restart personal-hub && sleep 5 && systemctl is-active personal-hub && curl -sf http://127.0.0.1:8080/actuator/health'